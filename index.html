<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIR_School_Control</title>
    <style>
        :root {
            --primary-color: #2b4c80;
            --bg-color: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .gps-box {
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            padding: 4px 0;
            width: 100%;
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .status-box {
            border-radius: 4px;
            padding: 4px 0;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
            flex-shrink: 0;
            color: white;
            transition: background-color 0.3s;
        }
        .status-box.online {
            background-color: #00b050;
            border: 1px solid #00803a;
        }
        .status-box.offline {
            background-color: #d32f2f;
            border: 1px solid #b71c1c;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .time-box, .date-box {
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 6px 0;
            width: 48%;
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .header h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 26px;
            letter-spacing: 0.5px;
        }
        .header-line {
            height: 4px;
            background-color: var(--primary-color);
            margin: 5px 0 15px 0;
            border: none;
        }
        #loginForm {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .login-input {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            box-sizing: border-box;
        }
        .login-input::placeholder {
            color: var(--primary-color);
            opacity: 1;
        }
        .login-btn {
            width: 60%;
            padding: 14px;
            background-color: #3b5b98;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover { background-color: #2b4c80; }
        .login-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .selectors-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .dropdown {
            width: 48%;
            padding: 8px;
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            background-color: white;
            text-align: center;
            appearance: auto;
            outline: none;
        }
        #opsForm {
            display: none; 
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }
        .main-card {
            background-color: #f2f3f5;
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .daily-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .camera-icon { font-size: 24px; }
        .daily-text {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            flex-grow: 1;
        }
        .checkbox-icon {
            width: 24px;
            height: 24px;
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4CAF50;
            font-weight: bold;
            font-size: 18px;
        }
        .image-placeholder {
            width: 100%;
            min-height: 200px;
            background-color: #ffffff;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        #capturedImageContainer {
            width: 100%;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            flex-shrink: 0;
        }
        #finalPhoto {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--primary-color);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        #retryPhotoBtn {
            margin-top: 8px;
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .details-textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            resize: none;
            font-size: 16px;
            color: var(--primary-color);
            font-weight: bold;
            font-family: inherit;
            flex-shrink: 0;
        }
        .details-textarea::placeholder {
            color: var(--primary-color);
            text-align: center;
            line-height: 80px;
        }
        .details-textarea:focus::placeholder { color: transparent; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #2f5697;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .submit-btn:hover { background-color: #203c6b; }
        .submit-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #statusMessage {
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            display: none;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .status-success { background-color: #d4edda; color: #155724; }
        .status-loading { background-color: #fff3cd; color: #856404; }
        .status-error { background-color: #f8d7da; color: #721c24; }
        #cameraOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            display: none; 
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }
        #cameraOverlay.active { display: flex; }
        .camera-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            background: #000; position: relative;
        }
        #liveVideo { width: 100%; height: 100%; object-fit: cover; }
        #photoCanvas { display: none; }
        .camera-controls {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 20px;
        }
        .camera-btn {
            padding: 12px 25px; border-radius: 30px; font-weight: bold;
            font-size: 16px; cursor: pointer; border: none;
        }
        .capture-btn { background-color: #fff; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .close-camera-btn { background-color: #f44336; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="gpsBox" class="gps-box">Coordenadas GPS: Obteniendo ubicación...</div>
        <div id="connectionIndicator" class="status-box online">Conexión Establecida</div>
        
        <div class="top-bar">
            <div id="liveTime" class="time-box">00:00:00</div>
            <div id="liveDate" class="date-box">00/00/0000</div>
        </div>
        <div class="header">
            <h2>AIR_School_Control</h2>
            <hr class="header-line">
        </div>

        <form id="loginForm">
            <input type="text" id="userInput" class="login-input" placeholder="Usuario...." required autocomplete="off">
            <input type="password" id="passInput" class="login-input" placeholder="Contraseña...." required>
            <button type="submit" id="loginBtn" class="login-btn">Ingresar</button>
        </form>

        <form id="opsForm">
            <div class="selectors-container">
                <select id="zonaSelect" class="dropdown" required>
                    <option value="" disabled selected>Zona</option>
                    <option value="Costa">Costa</option>
                    <option value="Taura">Taura</option>
                    <option value="Estuario">Estuario</option>
                </select>
                <select id="centroSelect" class="dropdown" disabled required>
                    <option value="" disabled selected>Centro</option>
                </select>
            </div>
            <div class="main-card">
                <button type="button" class="daily-row" id="startCameraBtn">
                    <span class="camera-icon">📸</span>
                    <span class="daily-text" id="uploadLabel">Daily 15” minutos</span>
                    <span class="checkbox-icon" id="photoCheckmark"></span>
                </button>
                <div id="imagePlaceholder" class="image-placeholder">Imagen....</div>
                <div id="capturedImageContainer">
                    <img id="finalPhoto" alt="Foto capturada">
                    <button type="button" id="retryPhotoBtn">Eliminar y Reintentar</button>
                </div>
                <textarea class="details-textarea" placeholder="Redacte detalles tratados......" required></textarea>
            </div>
            <button type="submit" id="btnSubmit" class="submit-btn">Guardar Registro</button>
        </form>
        <div id="statusMessage"></div>
    </div>

    <div id="cameraOverlay">
        <div class="camera-container">
            <video id="liveVideo" autoplay playsinline></video>
            <canvas id="photoCanvas"></canvas> 
            <div class="camera-controls">
                <button type="button" class="camera-btn close-camera-btn" id="closeCameraBtn">Cancelar</button>
                <button type="button" class="camera-btn capture-btn" id="captureBtn">Capturar Foto</button>
            </div>
        </div>
    </div>

    <script>
        // --- AQUÍ ESTÁ LA NUEVA URL ACTUALIZADA ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcBSl38nZOcHL5F4E4Lbe06GwlendqujIAgnWXg9atFc3pHgnX1Vx3S70g-CiPE6w0yA/exec";

        function checkConnection() {
            const indicator = document.getElementById('connectionIndicator');
            if (navigator.onLine) {
                indicator.textContent = 'Conexión Establecida';
                indicator.className = 'status-box online';
            } else {
                indicator.textContent = 'Sin Conexión';
                indicator.className = 'status-box offline';
            }
        }
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);
        checkConnection();

        let currentLat = "";
        let currentLon = "";
        let isWatchingGPS = false;
        let loggedInUser = "";

        function getRealTimeLocation() {
            const gpsBox = document.getElementById('gpsBox');
            
            if ("geolocation" in navigator) {
                const options = {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 5000 
                };

                const successCallback = (position) => {
                    currentLat = position.coords.latitude.toFixed(5);
                    currentLon = position.coords.longitude.toFixed(5);
                    gpsBox.textContent = `Coordenadas GPS: ${currentLat} ; ${currentLon}`;
                };

                const errorCallback = (error) => {
                    if (!currentLat) {
                        if (error.code === error.PERMISSION_DENIED) {
                            gpsBox.textContent = `Coordenadas GPS: Permiso denegado`;
                        } else {
                            gpsBox.textContent = `Coordenadas GPS: Buscando señal...`;
                        }
                    }
                };

                navigator.geolocation.getCurrentPosition(successCallback, errorCallback, options);

                if (!isWatchingGPS) {
                    navigator.geolocation.watchPosition(successCallback, errorCallback, {
                        enableHighAccuracy: true,
                        timeout: 20000,
                        maximumAge: 0
                    });
                    isWatchingGPS = true;
                }
            } else {
                gpsBox.textContent = `Coordenadas GPS: No soportado`;
            }
        }
        getRealTimeLocation();

        function updateDateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('liveTime').textContent = `${hours}:${minutes}:${seconds}`;

            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0'); 
            const year = now.getFullYear();
            document.getElementById('liveDate').textContent = `${day}/${month}/${year}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime(); 

        const loginForm = document.getElementById('loginForm');
        const opsForm = document.getElementById('opsForm');
        const loginBtn = document.getElementById('loginBtn');
        const userInput = document.getElementById('userInput');
        const passInput = document.getElementById('passInput');
        const statusMessage = document.getElementById('statusMessage');

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();
            if (!navigator.onLine) {
                alert('No hay conexión a internet para verificar los datos.');
                return;
            }

            const user = userInput.value.trim();
            const pass = passInput.value.trim();

            loginBtn.disabled = true;
            loginBtn.innerText = "Verificando...";

            const payloadLogin = {
                action: "login",
                usuario: user,
                contrasena: pass,
                fecha: document.getElementById('liveDate').textContent,
                hora: document.getElementById('liveTime').textContent,
                latitud: currentLat,
                longitud: currentLon
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payloadLogin)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    loggedInUser = user;
                    loginForm.style.display = 'none';
                    opsForm.style.display = 'flex';
                } else {
                    alert('Usuario o contraseña incorrectos.');
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Ingresar";
                }
            })
            .catch(error => {
                console.error(error);
                alert("Error de conexión al verificar el usuario.");
                loginBtn.disabled = false;
                loginBtn.innerText = "Ingresar";
            });
        });

        const zonaSelect = document.getElementById('zonaSelect');
        const centroSelect = document.getElementById('centroSelect');

        const centrosPorZona = {
            "Costa": ["Gramilesa I", "Gramilesa II", "Gramilesa III", "Engungamar"],
            "Taura": ["Algarrobo", "Costa Camaron", "San Olmedo Fase 1-2", "San Olmedo Fase 3"],
            "Estuario": ["Chongon", "Sabana Grande"]
        };

        zonaSelect.addEventListener('change', function() {
            const zonaSeleccionada = this.value;
            centroSelect.innerHTML = '<option value="" disabled selected>Centro</option>';
            if (zonaSeleccionada && centrosPorZona[zonaSeleccionada]) {
                centrosPorZona[zonaSeleccionada].forEach(centro => {
                    const option = document.createElement('option');
                    option.value = centro;
                    option.textContent = centro;
                    centroSelect.appendChild(option);
                });
                centroSelect.disabled = false;
            } else {
                centroSelect.disabled = true;
            }
        });

        const startCameraBtn = document.getElementById('startCameraBtn');
        const uploadLabel = document.getElementById('uploadLabel');
        const photoCheckmark = document.getElementById('photoCheckmark');
        const textarea = document.querySelector('.details-textarea');
        const btnSubmit = document.getElementById('btnSubmit');

        const cameraOverlay = document.getElementById('cameraOverlay');
        const liveVideo = document.getElementById('liveVideo');
        const photoCanvas = document.getElementById('photoCanvas');
        const captureBtn = document.getElementById('captureBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');

        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const capturedImageContainer = document.getElementById('capturedImageContainer');
        const finalPhoto = document.getElementById('finalPhoto');
        const retryPhotoBtn = document.getElementById('retryPhotoBtn');

        let capturedPhotoData = null; 
        let currentStream = null;

        function stopCamera() {
            cameraOverlay.classList.remove('active');
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        startCameraBtn.addEventListener('click', async () => {
            if (capturedPhotoData) return; 
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Navegador no soporta cámara.');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                currentStream = stream;
                liveVideo.srcObject = stream;
                cameraOverlay.classList.add('active'); 
            } catch (error) {
                alert('No se pudo acceder a la cámara.');
            }
        });

        closeCameraBtn.addEventListener('click', stopCamera);

        captureBtn.addEventListener('click', () => {
            if (!currentStream) return;
            photoCanvas.width = liveVideo.videoWidth;
            photoCanvas.height = liveVideo.videoHeight;
            const context = photoCanvas.getContext('2d');
            context.drawImage(liveVideo, 0, 0, photoCanvas.width, photoCanvas.height);
            
            capturedPhotoData = photoCanvas.toDataURL('image/png');
            finalPhoto.src = capturedPhotoData;
            
            imagePlaceholder.style.display = 'none';
            capturedImageContainer.style.display = 'block';
            uploadLabel.innerHTML = 'Foto Capturada ✅';
            photoCheckmark.innerHTML = '✔️';

            getRealTimeLocation(); 
            stopCamera();
        });

        retryPhotoBtn.addEventListener('click', () => {
            capturedPhotoData = null;
            finalPhoto.src = '';
            capturedImageContainer.style.display = 'none';
            imagePlaceholder.style.display = 'flex';
            uploadLabel.innerHTML = 'Daily 15” minutos';
            photoCheckmark.innerHTML = '';
        });

        opsForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            if (!zonaSelect.value || !centroSelect.value) {
                alert('Es obligatorio seleccionar una Zona y un Centro.');
                return;
            }
            if (!capturedPhotoData) {
                alert('Es obligatorio tomar una foto.');
                return;
            }
            if (!navigator.onLine) {
                alert('No hay conexión a internet. Espere a que se restablezca para enviar el registro.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Guardando...";
            statusMessage.style.display = 'block';
            statusMessage.className = 'status-loading';
            statusMessage.innerText = "Subiendo datos y evidencia a la nube...";

            const payload = {
                action: "guardar",
                usuario: loggedInUser,
                fecha: document.getElementById('liveDate').textContent,
                hora: document.getElementById('liveTime').textContent, 
                zona: zonaSelect.value,         
                centro: centroSelect.value,     
                detalle: textarea.value,        
                latitud: currentLat,            
                longitud: currentLon,           
                imagenBase64: capturedPhotoData
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if(!response.ok) throw new Error("Error en la respuesta del servidor");
                return response.json();
            })
            .then(data => {
                if(data.status === "error") throw new Error(data.message);
                
                statusMessage.className = 'status-success';
                statusMessage.innerText = "¡Registro guardado correctamente!";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Guardar Registro";
                opsForm.reset();
                centroSelect.disabled = true; 
                capturedPhotoData = null;
                finalPhoto.src = '';
                capturedImageContainer.style.display = 'none';
                imagePlaceholder.style.display = 'flex';
                uploadLabel.innerHTML = 'Daily 15” minutos';
                photoCheckmark.innerHTML = '';
                setTimeout(() => { statusMessage.style.display = 'none'; }, 4000);
            })
            .catch(error => {
                console.error(error);
                statusMessage.className = 'status-error';
                statusMessage.innerText = "Error al guardar en la nube.";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Guardar Registro";
            });
        });
    </script>
</body>
</html>
